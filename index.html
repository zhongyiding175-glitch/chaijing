<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>精读 · 查经</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="查经">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="离线查经：经文、原文编码、CBOL 词条、基督徒文摘解经系列">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">精读<span class="dot">·</span>查经</div>
  <nav class="tabs">
    <button type="button" id="tabAsk" class="tab on">问</button>
    <button type="button" id="tabRead" class="tab">读</button>
  </nav>
  <div class="controls" id="readControls" hidden>
    <select id="bookSel" aria-label="书卷"></select>
    <select id="chapSel" aria-label="章"></select>
    <div class="navbtns">
      <button id="prevBtn" type="button" aria-label="上一章">‹</button>
      <button id="nextBtn" type="button" aria-label="下一章">›</button>
    </div>
  </div>
</header>

<div class="installbar" id="installBar" hidden>
  <span id="installText"></span>
  <button type="button" id="installGo" hidden>安装</button>
  <button type="button" id="installClose" aria-label="关闭">✕</button>
</div>

<main class="layout">

  <section class="askview" id="askView">
    <form class="askbar" id="askForm" autocomplete="off">
      <input id="q" type="search" placeholder="问点什么：虚心是什么意思" aria-label="提问">
      <button type="submit" aria-label="查询">查</button>
    </form>

    <div class="askhint">可以这么问：</div>
    <div class="examples" id="examples">
      <button type="button" data-q="虚心是什么意思">虚心是什么意思</button>
      <button type="button" data-q="虚心有什么特殊含义">虚心有什么特殊含义</button>
      <button type="button" data-q="罗马书讲的是什么">罗马书讲的是什么</button>
      <button type="button" data-q="太5:3">太5:3</button>
      <button type="button" data-q="为什么说虚心的人有福">为什么说虚心的人有福</button>
      <button type="button" data-q="神爱世人">神爱世人</button>
      <button type="button" data-q="温柔 原文">温柔 原文</button>
    </div>

    <div class="askresult" id="askResult">
      <div class="welcom">
        <p class="verse119">【诗119:105】你的话是我脚前的灯，是我路上的光。</p>
      </div>
    </div>
  </section>

  <section class="readview" id="readView" hidden>
    <div class="reader" id="reader"></div>
    <aside class="panel" id="panel"></aside>
  </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
